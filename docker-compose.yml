version: '3.8'

services:
  carnet-recette:
    build:
      context: .
      dockerfile: Dockerfile
    image: carnet-recette:latest
    container_name: carnet-recette
    restart: unless-stopped
    ports:
      # Port hôte configurable : 3080 par défaut (changeable via APP_PORT dans Portainer)
      # Ne rentre pas en conflit avec le port 3000 existant.
      - "${APP_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Optionnel : si vous souhaitez préconfigurer votre clé Gemini API globalement
      # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Volume nommé pour stocker durablement la base SQLite (recettes, favoris, historique IA)
      - cook_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/recipes').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cook_data:
    name: cook_recipes_data
    driver: local
