version: '3.8'

services:
  backend:
    build: ./backend
    container_name: mes-recettes-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: '*'
    volumes:
      - recipes-data:/app/data
    expose:
      - "3001"

  frontend:
    build: ./frontend
    container_name: mes-recettes-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  recipes-data:
